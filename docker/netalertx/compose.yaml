services:
  netalertx:
    container_name: netalertx
    image: ghcr.io/netalertx/netalertx:latest

    network_mode: host
    read_only: true

    cap_drop:
      - ALL

    cap_add:
      - NET_ADMIN
      - NET_RAW
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID

    restart: unless-stopped

    environment:
      PORT: "20211"

    volumes:
      - netalertx-data:/data
      - /etc/localtime:/etc/localtime:ro

    tmpfs:
      - "/tmp:uid=20211,gid=20211,mode=1700,rw,noexec,nosuid,nodev,async,noatime,nodiratime"

volumes:
  netalertx-data:
    name: netalertx-data
